<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edalin | Monopoly Cities</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--rx:50deg;--rz:0deg;--w:min(94vw,80vh,800px);--sh:.74}
body{--a:#12030a;--b:#7a0f1f;--c:#d1242f;--tx:#fff;--g:rgba(255,255,255,.08);--gb:rgba(255,255,255,.2);--in:rgba(0,0,0,.34);--ac:#a855f7}
body[data-t=glass]{--a:#140a3c;--b:#0f7c8f;--c:#c2185b}
body[data-t=sunset]{--a:#3b0a45;--b:#e4572e;--c:#f9a03f}
body[data-t=ocean]{--a:#02233a;--b:#0a7ea4;--c:#48cae4}
body[data-t=forest]{--a:#0b2a1e;--b:#2d8a5b;--c:#c9d46a}
body[data-t=light]{--a:#e9eff8;--b:#f7cfe4;--c:#c7e6ff;--tx:#1c2333;--g:rgba(255,255,255,.6);--gb:rgba(255,255,255,.95);--in:rgba(255,255,255,.75)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--tx);background:var(--a);overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
#bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:fl 20s ease-in-out infinite alternate}
#bg i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--c)}
#bg i:nth-child(2){width:52vw;height:52vw;right:-14vw;bottom:-18vw;background:var(--b);animation-delay:-7s}
#bg i:nth-child(3){width:30vw;height:30vw;left:38vw;top:32vh;background:var(--ac);opacity:.28;animation-delay:-12s}
@keyframes fl{to{transform:translate(6vw,4vh) scale(1.15)}}
.gl{background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.22)}
input,select,button{font:inherit;color:inherit;border-radius:10px;border:1px solid var(--gb);background:var(--in);padding:8px 12px}
button{cursor:pointer;background:var(--g);font-weight:700;transition:background .2s,transform .15s}
button:hover:not(:disabled){background:var(--gb)}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
[hidden]{display:none!important}
header{position:sticky;top:10px;z-index:20;display:flex;align-items:center;gap:12px;width:min(1180px,calc(100% - 24px));margin:10px auto;padding:8px 14px}
.lg{border-radius:50%;object-fit:cover;cursor:pointer;user-select:none;-webkit-user-drag:none;animation:sp 70s linear infinite;box-shadow:0 0 22px #ff1a1a99}
header .lg{width:46px;height:46px}
@keyframes sp{to{transform:rotate(360deg)}}
.brand{font-family:Cinzel,serif;font-weight:900;font-size:1.5rem;letter-spacing:.12em;direction:ltr}
nav{display:flex;gap:2px;margin-inline-start:auto;overflow-x:auto}
nav button{background:none;border-color:transparent;white-space:nowrap}
#lobby{width:min(440px,calc(100% - 24px));margin:5vh auto;padding:26px;display:grid;gap:14px;text-align:center}
#lobby .lg{width:130px;height:130px;margin:0 auto}
#lobby h1{margin:0;font-family:Cinzel,serif;font-size:2.6rem;letter-spacing:.14em}
#lobby p{margin:0;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{--k:#fff;display:flex;gap:6px;align-items:center}
.chips button.on{background:var(--k);color:#111;border-color:var(--k)}
#game{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:flex-start;padding:6px 12px 40px}
#stage{position:relative;width:var(--w);height:calc(var(--w)*var(--sh));perspective:1500px;perspective-origin:50% 25%;transition:height .4s}
#bd{position:absolute;left:0;top:50%;width:var(--w);height:var(--w);margin-top:calc(var(--w)/-2);transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateZ(var(--rz));transition:transform .45s;border-radius:18px;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--ac) 38%,transparent),transparent 62%),linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid var(--gb);box-shadow:0 2px 0 #fff3,0 5px 0 rgba(0,0,0,.4),0 8px 0 rgba(0,0,0,.45),0 11px 0 rgba(0,0,0,.5),0 40px 60px rgba(0,0,0,.45)}
#tiles{position:absolute;inset:0;display:grid;grid-template:repeat(11,1fr)/repeat(11,1fr);gap:3px;padding:8px;transform-style:preserve-3d;direction:ltr}
.t{position:relative;overflow:hidden;font-size:clamp(6px,calc(var(--w)/70),12px);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:7px;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid var(--gb);box-shadow:0 3px 0 rgba(0,0,0,.35);direction:rtl;line-height:1.2;transition:transform .2s}
.t:hover{transform:translateZ(14px)}
.t.own{transform:translateZ(7px);border-bottom:4px solid var(--oc)}
.t.own:hover{transform:translateZ(18px)}
.cb{position:absolute;top:0;left:0;right:0;height:22%}
.t b{margin-top:14%;font-weight:700}
.t small{opacity:.75}
.t.start{background:linear-gradient(135deg,#22c55e99,transparent)}
.t.go,.t.jail{background:linear-gradient(135deg,#ef444499,transparent)}
.t.park{background:linear-gradient(135deg,#f59e0b88,transparent)}
#pawns{position:absolute;inset:8px;pointer-events:none;transform-style:preserve-3d}
.pn{--pc:#f55;position:absolute;width:3.6%;aspect-ratio:1/1.6;margin-left:calc((var(--i) - 2)*1.3%);transform-origin:50% 100%;transform:translate(-50%,-92%) rotateX(calc(var(--rx)*-1));transition:left .18s linear,top .18s linear;filter:drop-shadow(0 6px 3px rgba(0,0,0,.55))}
.pn::before{content:'';position:absolute;left:22%;top:0;width:56%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--pc) 55%,#0007)}
.pn::after{content:'';position:absolute;left:0;right:0;bottom:0;height:70%;clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);background:linear-gradient(90deg,#0006,var(--pc) 32%,#fffa 48%,var(--pc) 64%,#0008)}
.pn.on{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 6px 3px rgba(0,0,0,.55)) drop-shadow(0 0 9px #fff)}}
#mid{position:absolute;inset:calc(8px + (100% - 16px)/11);transform:translateZ(1px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.4vw,14px);text-align:center;direction:rtl}
#em{font-size:clamp(2rem,6vw,4.4rem);line-height:1;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 8px 10px #0006)}
@keyframes bob{50%{transform:translateY(-8px)}}
#cn{margin:0;font-size:clamp(1.1rem,3vw,2.2rem);font-weight:900}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dice{display:flex;gap:clamp(14px,3vw,30px);perspective:700px;--ds:clamp(34px,5.4vw,58px)}
.dice.toss{animation:toss 1s}
@keyframes toss{35%{transform:translateY(-34px) scale(1.25)}70%{transform:none}85%{transform:scale(.96)}}
.die{width:var(--ds);height:var(--ds);position:relative;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.15,.7,.2,1)}
.fc{position:absolute;inset:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:15%;border-radius:16%;background:linear-gradient(145deg,#ffffff,#dfe3ef)!important;color:#111;backface-visibility:hidden;box-shadow:inset 0 0 0 2px #ffffffaa,0 5px 12px #0005}
.fc i{width:78%;height:78%;margin:auto;border-radius:50%;background:#171a22!important;box-shadow:inset 1px 1px 2px #fff3,0 1px 2px #0008}
.fc:nth-child(1){transform:translateZ(calc(var(--ds)/2))}
.fc:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--ds)/2))}
.fc:nth-child(3){transform:rotateX(90deg) translateZ(calc(var(--ds)/2))}
.fc:nth-child(4){transform:rotateX(-90deg) translateZ(calc(var(--ds)/2))}
.fc:nth-child(5){transform:rotateY(-90deg) translateZ(calc(var(--ds)/2))}
.fc:nth-child(6){transform:rotateY(180deg) translateZ(calc(var(--ds)/2))}
#side{width:min(96vw,340px);padding:14px;display:grid;gap:12px}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0}
.pl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px}
.pl.cur{background:var(--gb)}
.pl i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;flex:none}
.pl span{flex:1}
small.h{opacity:.7;font-size:.78rem}
#log{max-height:170px;overflow:auto;font-size:.85rem;display:grid;gap:3px;opacity:.9}
#con{position:fixed;left:12px;bottom:12px;z-index:40;width:min(430px,calc(100vw - 24px));padding:12px;display:grid;gap:8px;direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:.9rem;opacity:0;transform:translateY(24px) scale(.97);pointer-events:none;transition:.28s;border-color:#ff3b3b88}
#con.on{opacity:1;transform:none;pointer-events:auto}
#cout{margin:0;white-space:pre-wrap;min-height:1.2em;color:#ff8a8a}
#mo{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
#mb{width:min(520px,calc(100% - 24px));max-height:84vh;overflow:auto;padding:22px;display:grid;gap:12px;line-height:1.9}
#mb h3{margin:0;font-size:1.3rem}#mb p,#mb ol{margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{min-height:100dvh}
body[data-t=purple]{--a:#130f1d;--b:#5b21b6;--c:#c026d3}
button,input{touch-action:manipulation}
input{font-size:16px}
.pri{background:var(--ac);border-color:transparent;color:#fff}
.pri:hover:not(:disabled){background:var(--ac);filter:brightness(1.15)}
#dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 12px;width:max-content;max-width:calc(100% - 16px)}
#dock button{min-height:42px}
#who{font-weight:700}
#game{padding-bottom:130px}
#con{bottom:110px}
.rcode{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rcode b{font-size:1.6rem;letter-spacing:.22em;font-family:Cinzel,serif}
.t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl.out{opacity:.4;text-decoration:line-through}
#log{max-height:200px;overflow-wrap:anywhere}
@media(max-width:700px){.t{font-size:7px}header .brand{font-size:1.2rem}#lobby{margin:3vh auto}}

@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes ang{to{--ang:360deg}}
#bd::before{content:'';position:absolute;inset:-3px;border-radius:21px;background:conic-gradient(from var(--ang),transparent 55%,var(--ac) 80%,transparent);filter:blur(7px);opacity:.85;transform:translateZ(-2px);animation:ang 7s linear infinite}
#bg::after{content:'';position:absolute;inset:-50%;background-image:radial-gradient(2px 2px at 20px 30px,#fffa,transparent),radial-gradient(1.5px 1.5px at 90px 120px,#fff8,transparent),radial-gradient(2px 2px at 160px 60px,#fff6,transparent);background-size:200px 200px;opacity:.55;animation:drift 50s linear infinite}
@keyframes drift{to{transform:translateY(200px)}}
.brand{text-shadow:0 0 14px var(--ac),0 0 34px var(--ac);animation:bp 3s ease-in-out infinite alternate}
@keyframes bp{from{text-shadow:0 0 8px var(--ac),0 0 18px var(--ac)}to{text-shadow:0 0 16px var(--ac),0 0 44px var(--ac)}}
.lg{animation:sp 70s linear infinite,lgp 3s ease-in-out infinite alternate}
@keyframes lgp{from{box-shadow:0 0 14px #ff1a1a88}to{box-shadow:0 0 36px #ff2a2add}}
.pri:not(:disabled){animation:gl 1.8s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 20px var(--ac)}}
.pri:hover:not(:disabled){box-shadow:0 0 22px var(--ac)}
#lobby{animation:rise .8s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
.t:hover{box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 16px var(--ac)}
.t.own{box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 12px var(--oc)}
#em{filter:drop-shadow(0 0 20px var(--ac))}
#potd{font-weight:700;min-height:1em;text-shadow:0 0 10px var(--ac)}
.pn.on{animation:pulse2 1.4s ease-in-out infinite}
@keyframes pulse2{50%{filter:drop-shadow(0 6px 3px rgba(0,0,0,.55)) drop-shadow(0 0 12px var(--pc))}}
.dice.toss{animation:toss 1s;filter:drop-shadow(0 0 16px var(--ac))}
.pl b.up{animation:up .9s}.pl b.dn{animation:dn .9s}
@keyframes up{0%{color:#4ade80;text-shadow:0 0 12px #4ade80;transform:scale(1.4)}}
@keyframes dn{0%{color:#f87171;text-shadow:0 0 12px #f87171;transform:scale(1.4)}}
#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:60;pointer-events:none;display:grid;gap:6px;justify-items:center;width:max-content;max-width:calc(100% - 24px)}
.tt{padding:8px 18px;border-radius:999px;background:var(--g);border:1px solid var(--ac);box-shadow:0 0 18px var(--ac);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:tin .4s cubic-bezier(.2,1.4,.4,1),tout .4s 2.7s forwards;overflow-wrap:anywhere}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:70;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(108vh) rotate(720deg)}}
.sr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sr input[type=number],.sr select{width:120px}
.sr input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}

/* ===== EDALIN PRO UI ===== */
#game{max-width:1500px;margin:0 auto;align-items:flex-start}
#side{width:min(96vw,390px);position:sticky;top:82px;max-height:calc(100dvh - 105px);overflow:auto}
#side::-webkit-scrollbar{width:6px}#side::-webkit-scrollbar-thumb{background:var(--gb);border-radius:9px}
.panel{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.panel:last-child{border-bottom:0}.panel h4{margin:0 0 8px;font-size:1rem}
#leader,#assets,#tradeBox{display:grid;gap:7px}
.lbrow{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.lbrow.me{background:linear-gradient(90deg,var(--ac),rgba(255,255,255,.06));box-shadow:0 0 16px color-mix(in srgb,var(--ac) 30%,transparent)}
.lbpos{font-family:Cinzel,serif;font-weight:900;text-align:center}.lbname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbmoney{font-weight:900;direction:ltr}
.asset{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:10px;background:rgba(255,255,255,.045)}
.asset b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.asset small{opacity:.7}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.side-actions button{min-width:0}
#tradeBox select,#tradeBox input{width:100%}.offer{padding:8px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--gb)}
.offer button{margin-top:6px;width:100%}
@media(max-width:900px){#game{display:block}#stage{margin:0 auto}#side{position:relative;top:auto;width:min(96vw,600px);margin:10px auto 0;max-height:none}}
@media(max-width:700px){
 #stage{--w:min(96vw,92vh,620px);width:var(--w)}
 #bd{width:var(--w);height:var(--w)}
 .dice{gap:12px;z-index:8}.die{--ds:clamp(40px,12vw,56px);filter:drop-shadow(0 5px 8px rgba(0,0,0,.65))}
 .fc{background:linear-gradient(145deg,#ffffff,#e7e9f2)!important;border:2px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px rgba(255,255,255,.65),0 5px 12px rgba(0,0,0,.3)}
 .fc i{background:#171a22!important;box-shadow:inset 1px 1px 2px rgba(255,255,255,.18)}
 #mid{z-index:5}
}

</style>
</head>
<body data-t="purple">
<div id="bg"><i></i><i></i><i></i></div>
<header class="gl">
 <img class="lg" id="logo" src="logo.jpg" alt="EdaPoly" draggable="false">
 <b class="brand">EdaPoly</b>
 <nav id="nav"><button data-m="settings">تنظیمات</button><button data-m="cities">شهرها</button><button data-m="themes">تم</button><button data-m="rules">راهنما</button><button data-m="about">درباره</button><button id="vw">زاویه دید</button></nav>
</header>
<div id="lobby" class="gl">

 </div>
 <div id="lb-join" hidden><p>کد اتاق: <b id="rc0" dir="ltr"></b></p><button id="jn" class="pri">پیوستن به بازی</button></div>

</div>

<script>
const $=id=>document.getElementById(id);
const norm=s=>String(s).toLowerCase().replace(/[\s\-_\u200c]/g,'');
const COL=['#8d6e63','#4fc3f7','#ec407a','#ffa726','#ef5350','#fdd835','#66bb6a','#5c6bc0'];
const PC=['#ff5252','#40c4ff','#69f0ae','#ffd740','#e040fb','#ff9e80'];

function cmd(x){

 $('b1').disabled=!(on&&mine&&!S.rolled);$('b2').disabled=!(on&&mine&&pt);$('b3').disabled=!(on&&mine&&S.rolled);
 $('b2').textContent=pt?`خرید ${pt.name} (${pt.price})`:'خرید ملک';
 const rc=S.rc||0;
 if(rc!==lastRc){
  const first=lastRc<0;lastRc=rc;
  [0,1].forEach(k=>{const [x,y]=FR[S.dice[k]-1],e=$('d'+k),n=first?0:360*(2+(Math.random()*2|0));e.style.transition=first?'none':'';e.style.transform=`rotateX(${x+n}deg) rotateY(${y+n+(k?360:0)}deg)`});
  if(!first){const d=$('dice');d.classList.remove('toss');void d.offsetWidth;d.classList.add('toss');dl=1100}
 }
 pawns();
 $('pls').innerHTML=S.players.map((p,i)=>{const cls=pc[i]!=null&&p.cash!=pc[i]?(p.cash>pc[i]?'up':'dn'):'';pc[i]=p.cash;const nw=p.cash+Object.keys(S.own).filter(k=>S.own[k]==i).reduce((a,k)=>a+T[k].price,0);return`<div class="pl ${i==S.turn?'cur':''} ${p.out?'out':''}"><i style="background:${p.col}"></i><span>${esc(p.name)}<small class="h"> ثروت ${nw}</small></span><b class="${cls}">${p.cash}</b></div>`}).join('');
 $('log').innerHTML=S.log.map(l=>`<div>${esc(l)}</div>`).join('');
 if(S.log[0]!==tl){tl=S.log[0];toast(tl)}if(S.win&&!won){won=1;confetti()}$('rcode').textContent=S.code||'';
 const invitePeer=peer&&peer.id?peer.id:('edapoly-'+(S.code||''));
 $('link').value=location.origin+location.pathname+'?room='+encodeURIComponent(S.code||'')+'&peer='+encodeURIComponent(invitePeer);
 $('inv').hidden=!S.code;
 $('loc').hidden=!host;
}
$('tiles').onclick=e=>{const el=e.target.closest('.t');if(!el||!S)return;const t=TL()[+el.dataset.i],o=S.own[t.i],ow=o!=null?S.players[o]:null;
 const inf={start:'با هر بار عبور حقوق می‌گیری.',jail:'فقط ملاقات.',park:'استراحت.',go:'تو را به زندان می‌فرستد.',tax:'مالیات می‌دهی.',chest:'پول کم یا زیاد می‌شود.',chance:'پول کم یا زیاد می‌شود.'};
 $('mb').innerHTML=`<h3>${t.name}</h3><p>${t.price?`قیمت: ${t.price}<br>اجاره: ${rent(t)}<br>صاحب: ${ow?esc(ow.name):'بانک'}`:inf[t.ty]||''}</p><button id="x">بستن</button>`;$('mo').hidden=false};
function run(x){
 if(!S){$('cout').textContent='بازی هنوز شروع نشده';return}
 if(host){const r=cmd(x);log(r);push();$('cout').textContent='> '+x+'\n'+r}
 else if(conn){conn.send({t:'cmd',x});$('cout').textContent='> '+x+' (ارسال شد)'}
 return'ok';
}
$('b1').onclick=()=>act('roll');$('b2').onclick=()=>act('buy');$('b3').onclick=()=>act('end');

// ----- menu, modal, console toggle -----
const chipsHTML=()=>Object.entries(CITIES).map(([id,v])=>`<button data-c="${id}" class="${id==(S?S.city:pick)?'on':''}" style="--k:${CX[id][0]}"><span>${CX[id][1]}</span>${v[0]}</button>`).join('');
const chips=()=>{$('cc').innerHTML=chipsHTML()};
function setTheme(k){document.body.dataset.t=k;try{localStorage.setItem('edapoly-theme',k)}catch(e){}}
function pickCity(id){if(!S)pick=id;else if(host){S.city=id;log('شهر: '+CITIES[id][0]);push()}else return;chips();if(!$('mo').hidden)modal('cities')}
function modal(k){
 const M={settings:setHTML(),
  cities:`<h3>شهرها</h3><div class="chips">${chipsHTML()}</div><small class="h">${S&&!host?'فقط میزبان می‌تواند شهر را عوض کند.':'با عوض کردن شهر، ملک‌ها و پول‌ها سر جایشان می‌مانند.'}</small>`,
  themes:`<h3>تم</h3><div class="chips">${Object.entries(THEMES).map(([k,v])=>`<button data-th="${k}" class="${document.body.dataset.t==k?'on':''}">${v}</button>`).join('')}</div>`,
  rules:`<h3>راهنما</h3><ol><li>هر نوبت تاس بینداز؛ مهره‌ات جلو می‌رود.</li><li>ملک بی‌صاحب را می‌توانی بخری؛ روی ملک بقیه اجاره می‌دهی.</li><li>هر بار از «شروع» رد شوی حقوق می‌گیری (در تنظیمات قابل تغییر).</li><li>شانس و صندوق پول کم یا زیاد می‌کنند؛ مالیات ۱۰۰ یا ۲۰۰ است.</li><li>«برو زندان» یک نوبتت را می‌سوزاند.</li><li>کلید فاصله هم تاس می‌اندازد.</li></ol>`,
  about:`<h3>EdaPoly</h3><p>مونوپولی شهرهای ایران. اتاق مستقیم بین مرورگرها ساخته می‌شود؛ پس تا وقتی میزبان صفحه را باز نگه دارد، بازی ادامه دارد.</p>`
 };
 $('mb').innerHTML=M[k]+'<button id="x">بستن</button>';$('mo').hidden=false;
}
$('nav').onclick=e=>{const b=e.target.closest('[data-m]');if(b)modal(b.dataset.m)};
$('mo').onclick=e=>{if(e.target.id=='mo'||e.target.id=='x')$('mo').hidden=true};
$('mb').onclick=e=>{const b=e.target.closest('button[data-c],button[data-th]');if(!b)return;if(b.dataset.c)pickCity(b.dataset.c);else{setTheme(b.dataset.th);modal('themes')}};
$('cc').onclick=e=>{const b=e.target.closest('button');if(b)pickCity(b.dataset.c)};
let lc=0,lt;
document.querySelectorAll('.lg').forEach(el=>el.onclick=()=>{
 lc++;clearTimeout(lt);lt=setTimeout(()=>lc=0,1400);
 if(lc>=3){lc=0;if($('con').classList.toggle('on'))setTimeout(()=>$('cin').focus(),60)}
});
document.addEventListener('keydown',e=>{
 if(e.key=='Escape'){$('mo').hidden=true;$('con').classList.remove('on')}
 if(e.code=='Space'&&S&&!/INPUT|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();if(!$('b1').disabled)act('roll')}
});
const doCmd=()=>{const v=$('cin').value.trim();if(v){run(v);$('cin').value=''}};
$('go').onclick=doCmd;$('cin').onkeydown=e=>{if(e.key=='Enter')doCmd()};
try{const s=localStorage.getItem('edapoly-theme');if(s&&THEMES[s])document.body.dataset.t=s}catch(e){}

// ----- lobby & network -----
const nameOf=()=>$('nm').value.trim()||'بازیکن';
const cl=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
const URLP=new URLSearchParams(location.search);
const rq=cl(URLP.get('room') || (location.hash.match(/(?:^#|[&#])room=([^&]+)/)||[])[1]);
const rqPeer=String(URLP.get('peer') || (location.hash.match(/(?:^#|[&#])peer=([^&]+)/)||[])[1] || '').trim();
const err=m=>{$('err').textContent=m||''};
if(rq){
  $('lb-host').hidden=true;
  $('lb-join').hidden=false;
  $('rc0').textContent=rq;
  $('nm').placeholder='اسمت را وارد کن و «ورود به اتاق» را بزن';
}else{
  $('lb-join').hidden=true;
}

chips();
const show=()=>{$('lobby').hidden=true;$('game').hidden=false};
const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const gen=()=>Array.from({length:5},()=>CH[Math.random()*CH.length|0]).join('');
const PEER_CFG={
  host:'0.peerjs.com',port:443,path:'/',secure:true,debug:1,
  config:{iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun.cloudflare.com:3478'}
  ]}
};
let joinTimer=0,joinBusy=false;
function resetNet(){
  clearTimeout(joinTimer);joinBusy=false;
  try{if(conn){conn.close()}}catch(e){}
  try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}
  conn=null;peer=null;host=false;conns=[];
}
function hostRoom(tries=0){
 resetNet();
 const code=gen();
 const peerId='edapoly-'+code+'-'+Math.random().toString(36).slice(2,8);
 err('در حال ساخت اتاق…');
 let pr;
 try{pr=new Peer(peerId,PEER_CFG)}catch(e){err('PeerJS اجرا نشد. صفحه را با Ctrl+F5 رفرش کن.');return}
 peer=pr;
 pr.on('open',()=>{
   clearTimeout(joinTimer);host=true;joinBusy=false;S=ns(pick);S.code=code;addP(nameOf(),'host');
   err('اتاق آماده است — لینک دعوت آماده شد.');
   show();render();
   const invite=location.origin+location.pathname+'?room='+encodeURIComponent(code)+'&peer='+encodeURIComponent(peerId);
   $('link').value=invite;
   modal('settings');
 });
 pr.on('connection',c=>{
   conns.push(c);
   c.on('open',()=>{try{c.send(S)}catch(e){}});
   c.on('data',d=>handle(d,c.peer));
   c.on('close',()=>{conns=conns.filter(x=>x!==c);});
   c.on('error',()=>{conns=conns.filter(x=>x!==c);});
 });
 pr.on('error',e=>{
   if(e.type==='unavailable-id'&&tries<8){try{pr.destroy()}catch(x){};setTimeout(()=>hostRoom(tries+1),250);return}
   const msg=e&&e.type==='network'?'سرور اتصال در دسترس نیست؛ اینترنت/فیلترشکن را بررسی کن.':('خطای اتصال: '+(e&&e.type?e.type:'نامشخص'));
   err(msg+' دوباره تلاش کن.');
 });
 pr.on('disconnected',()=>{if(!pr.destroyed)err('ارتباط با سرور PeerJS قطع شد؛ در حال اتصال مجدد…');if(!pr.destroyed)pr.reconnect()});
 joinTimer=setTimeout(()=>{if(!host){err('ساخت اتاق بیشتر از حد معمول طول کشید؛ دوباره «ساخت اتاق» را بزن.')}},15000);
}
function joinRoom(code,attempt=0){
 code=cl(code);
 if(code.length!==5){err('کد اتاق باید دقیقاً ۵ حرف/عدد انگلیسی باشد.');return}
 resetNet();joinBusy=true;S=null;err('در حال اتصال به اتاق '+code+'…');
 let pr;
 try{pr=new Peer(undefined,PEER_CFG)}catch(e){joinBusy=false;err('PeerJS اجرا نشد. صفحه را با Ctrl+F5 رفرش کن.');return}
 peer=pr;
 let gotState=false;
 pr.on('open',()=>{
   const target=rqPeer || ('edapoly-'+code);
   try{conn=pr.connect(target,{reliable:true,serialization:'json',metadata:{room:code},timeout:15000})}catch(e){retryJoin(code,attempt,'خطا در ساخت اتصال');return}
   if(!conn){retryJoin(code,attempt,'اتصال ساخته نشد');return}
   conn.on('open',()=>{err('اتصال برقرار شد؛ ورود به بازی…');try{conn.send({t:'hello',name:nameOf()})}catch(e){retryJoin(code,attempt,'ارسال اطلاعات بازیکن ناموفق بود')}});
   conn.on('data',d=>{if(d&&d.city){gotState=true;joinBusy=false;clearTimeout(joinTimer);S=d;err('');show();render()}});
   conn.on('close',()=>{if(gotState){S=null;$('game').hidden=true;$('dock').hidden=true;$('lobby').hidden=false;err('ارتباط با میزبان قطع شد.')}else retryJoin(code,attempt,'اتصال بسته شد')});
   conn.on('error',()=>{if(!gotState)retryJoin(code,attempt,'خطای کانال بازی')});
 });
 pr.on('error',e=>{
   if(gotState)return;
   if(e.type==='peer-unavailable'){retryJoin(code,attempt,'اتاق هنوز پیدا نشد')}
   else if(e.type==='network'){joinBusy=false;err('به سرور PeerJS دسترسی نشد. اینترنت را بررسی کن و دوباره امتحان کن.')}
   else {joinBusy=false;err('کد اتاق معتبر نیست یا اتاق بسته شده است.')}
 });
 joinTimer=setTimeout(()=>{if(!gotState)retryJoin(code,attempt,'زمان اتصال تمام شد')},10000);
}
function retryJoin(code,attempt,reason){
 clearTimeout(joinTimer);
 if(!joinBusy)return;
 try{if(conn)conn.close()}catch(e){}
 try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}
 conn=null;peer=null;
 if(attempt<3){joinBusy=true;err(reason+' — تلاش دوباره '+(attempt+2)+'/4…');setTimeout(()=>joinRoom(code,attempt+1),700);}
 else{joinBusy=false;err('اتصال به اتاق برقرار نشد. کد را دوباره بگیر و مطمئن شو میزبان هنوز داخل بازی است.');}
}
$('mk').onclick=()=>{const n=$('nm').value.trim();if(!n){err('اول اسمت را وارد کن.');$('nm').focus();return}hostRoom()};
$('jc2').onclick=()=>{const n=$('nm').value.trim();if(!n){err('اول اسمت را وارد کن.');$('nm').focus();return}joinRoom($('jc').value)};
$('jc').addEventListener('input',e=>{e.target.value=cl(e.target.value)});
$('jn').onclick=()=>{
 const n=$('nm').value.trim();
 if(!n){err('اول اسمت را وارد کن.');$('nm').focus();return}
 if(!rq){err('لینک اتاق نامعتبر است.');return}
 joinRoom(rq);
};
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter' && rq){e.preventDefault();$('jn').click()}});
$('b0').onclick=()=>act('start');
$('cp').onclick=()=>{$('link').select();navigator.clipboard&&navigator.clipboard.writeText($('link').value)};
$('la').onclick=()=>{const n=$('ln').value.trim();if(n&&host){addP(n.slice(0,14),'host');$('ln').value='';push()}};
const sendChat=()=>{const v=$('chat').value.trim();if(!v||!S)return;host?handle({t:'chat',x:v},'host'):conn.send({t:'chat',x:v});$('chat').value=''};
$('cs').onclick=sendChat;$('chat').onkeydown=e=>{if(e.key=='Enter')sendChat()};

let tl,won=0,pc=[];
function toast(m){const b=$('toast'),d=document.createElement('div');d.className='tt';d.textContent=m;b.appendChild(d);while(b.children.length>3)b.firstChild.remove();setTimeout(()=>d.remove(),3200)}
function confetti(){for(let i=0;i<70;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${Math.random()*100}vw;background:${PC[i%PC.length]};animation-delay:${Math.random()*1.5}s;animation-duration:${2.5+Math.random()*2}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),6500)}}
function setHTML(){
 if(!S)return'<h3>تنظیمات</h3><p>اول یک اتاق بساز.</p>';
 const s=S.set,d=host?'':'disabled';
 const num=(k,l,mn,mx,st)=>`<label class="sr">${l}<input type="number" data-k="${k}" value="${s[k]}" min="${mn}" max="${mx}" step="${st}" ${d} ${k=='cash'&&S.st?'disabled':''}></label>`;
 const chk=(k,l)=>`<label class="sr">${l}<input type="checkbox" data-k="${k}" ${s[k]?'checked':''} ${d}></label>`;
 return`<h3>تنظیمات اتاق</h3>${num('cash','پول شروع',100,50000,100)}${num('sal','حقوق عبور از شروع',0,2000,50)}${num('max','حداکثر بازیکن',2,8,1)}<label class="sr">ضریب اجاره<select data-k="rent" ${d}>${[.5,1,1.5,2,3].map(v=>`<option value="${v}" ${s.rent==v?'selected':''}>×${v}</option>`).join('')}</select></label>${chk('dbl','اجاره دوبرابر با مجموعهٔ کامل رنگ')}${chk('tax','مالیات فعال')}${chk('pot','جایزهٔ پارکینگ (مالیات‌ها جمع می‌شود)')}<small class="h">${host?(S.st?'پول شروع بعد از شروع بازی قابل تغییر نیست.':'تغییرها همان لحظه اعمال می‌شود.'):'فقط میزبان می‌تواند تنظیمات را عوض کند.'}</small>`;
}
$('mb').onchange=e=>{const t=e.target,k=t.dataset.k;if(!k||!host||!S)return;setSet(k,t.type=='checkbox'?t.checked:+t.value)};
$('tradeOffer').onclick=()=>{};
$('tradeOffer').onclick=()=>{
 if(!S)return;
 const to=$('tradePlayer').value,prop=Number($('tradeProperty').value),cash=Math.max(0,+$('tradeCash').value||0);
 if(!to||!Number.isInteger(prop)){toast('بازیکن و ملک را انتخاب کن');return}
 const payload={t:'trade',to,prop,cash};host?handle(payload,'host'):conn&&conn.send(payload);$('tradeCash').value='';
};
$('tradeCancel').onclick=()=>{$('tradePlayer').value='';$('tradeProperty').value='';$('tradeCash').value=''};
$('offers').onclick=e=>{
 const yes=e.target.closest('[data-trade-yes]'),no=e.target.closest('[data-trade-no]');
 const id=Number((yes||no)?.dataset.tradeYes||(no?.dataset.tradeNo));if(!id)return;
 const payload={t:'tradeAnswer',id,accept:!!yes};host?handle(payload,'host'):conn&&conn.send(payload);
};

</script>
